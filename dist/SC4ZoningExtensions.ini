; SC4ZoningExtensions example settings
;
; Place this file next to SC4ZoningExtensions.dll in your SimCity 4 Plugins folder.
; If no INI is present, the DLL creates one automatically with built-in defaults.
;
; Global settings:
[SC4ZoningExtensions]
; LogLevel=trace|debug|info|warn|error|critical|off
; LogToFile=true|false
; When LogToFile=true, SC4ZoningExtensions.log is written to the parent folder of the DLL/INI directory.
LogLevel=info
LogToFile=true

; Mouse controls:
; VerticalWheel=Zoom|DepthWhileDragging|Depth
;   What the mouse wheel does: zoom the camera, change the parcel depth while dragging a zone
;   (and zoom otherwise), or always change the depth.
; HorizontalWheel=Width|None
;   Tilting the wheel left/right changes the parcel width.
; HorizontalWheelUnitsPerStep=<integer>
;   0 = one width step per tilt. Otherwise, while the wheel stays tilted, one step per this many
;   wheel units (120 is one notch on most mice).
; ZoomButton, PresetPrevious, PresetNext, WidthWheelButton, DepthWheelButton,
; StreetIntervalWheelButton = None|Middle|XButton1|XButton2 (Mouse3/Mouse4/Mouse5 and Back/Forward also work)
;   Hold ZoomButton and turn the wheel to zoom (needed with VerticalWheel=Depth).
;   Click PresetPrevious/PresetNext to step through the zone's presets.
;   Hold a ...WheelButton and turn the wheel to change that value.
;   A button may be both a preset button and a wheel button: a click without turning the wheel
;   steps the preset.
[Controls]
VerticalWheel=DepthWhileDragging
HorizontalWheel=Width
HorizontalWheelUnitsPerStep=0
ZoomButton=XButton2
PresetPrevious=XButton1
PresetNext=XButton2
WidthWheelButton=None
DepthWheelButton=None
StreetIntervalWheelButton=None

; Per-zone settings:
; Supported keys in each section:
; ParcelWidth=<integer>
; ParcelDepth=<integer> (ParcelHeight is still read as the old name)
; Presets=<W>x<D>,<W>x<D>,... (each 1..16; default 1x1,1x2,2x1,2x2,2x3,3x2,3x3,3x4,4x3,4x4,5x5,6x6,7x7,8x8)
; StreetInterval=<integer>
; Network=None|Street|Road|OneWayRoad|Avenue
;
; Notes:
; - Width and depth are the starting parcel size for that zone type (1x2 when omitted). After that, the
;   tool remembers the last size used for each zone type and writes it back here when you leave the city.
; - Presets are the parcel sizes the preset buttons step through for that zone type.
; - StreetInterval is the default spacing used for the internal street grid when networks are enabled.
; - StreetInterval=0 uses the stock auto calculation based on parcel size.
; - Network is the default embedded road/street mode when you switch to that zone type.
; - The in-game cycle order is: None -> Street -> Road -> OneWayRoad -> Avenue
; - The in-game hotkeys are: Tab/Shift+Tab network, -/+ width, [/] depth, ,/. street interval.
; - Any key may be omitted. Missing values fall back to the DLL defaults.
; - Agriculture and industrial zones usually do not surface parcel width/depth meaningfully in-game,
;   so this example leaves those unset.
[ResidentialLowDensity]
ParcelWidth=2
ParcelDepth=3
StreetInterval=0
Network=Street

[ResidentialMediumDensity]
ParcelWidth=2
ParcelDepth=3
StreetInterval=0
Network=Street

[ResidentialHighDensity]
ParcelWidth=2
ParcelDepth=3
StreetInterval=0
Network=Street

[CommercialLowDensity]
ParcelWidth=2
ParcelDepth=3
StreetInterval=0
Network=Street

[CommercialMediumDensity]
ParcelWidth=2
ParcelDepth=3
StreetInterval=0
Network=Street

[CommercialHighDensity]
ParcelWidth=2
ParcelDepth=3
StreetInterval=0
Network=Street

[Agriculture]
StreetInterval=0
Network=Street

[IndustrialMediumDensity]
StreetInterval=0
Network=Street

[IndustrialHighDensity]
StreetInterval=0
Network=Street
